name: JARVIS Backend CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint, Test & Verify Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jarvis_test_db
          POSTGRES_USER: jarvis_user
          POSTGRES_PASSWORD: jarvis_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies for audio
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libsndfile1 libportaudio2 libasound2-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Run Ruff Linter
        run: |
          ruff check backend/app

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://jarvis_user:jarvis_password@localhost:5432/jarvis_test_db
          SECRET_KEY: test-secret-key-at-least-64-characters-long-for-testing-purposes-only
          MEMORY_ENCRYPTION_KEY: test-encryption-key-32-chars-long
        run: |
          cd backend
          alembic upgrade head

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://jarvis_user:jarvis_password@localhost:5432/jarvis_test_db
          SECRET_KEY: test-secret-key-at-least-64-characters-long-for-testing-purposes-only
          MEMORY_ENCRYPTION_KEY: test-encryption-key-32-chars-long
          DEBUG: "true"
        run: |
          cd backend
          pytest tests/ -v --tb=short

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (dry-run test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: jarvis-backend:latest
